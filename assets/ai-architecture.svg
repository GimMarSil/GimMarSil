90" rx="14" fill="#0E1D3A" stroke="#FFFFFF" stroke-opacity="0.1"/><rect x="20" y="0" width="56" height="3" rx="1.5" fill="url(#ac)"/><text class="f" x="20" y="36" font-size="12" font-weight="700" fill="#2DE1C2" letter-spacing="2">03</text><text class="f" x="20" y="62" font-size="20" font-weight="700" fill="#FFFFFF">AI agents</text><text class="f" x="20" y="100" font-size="14" fill="#A9BBD8">· LLMs (Claude)</text><text class="f" x="20" y="126" font-size="14" fill="#A9BBD8">· RAG over history</text><text class="f" x="20" y="152" font-size="14" fill="#A9BBD8">· Confidence traffic-light</text><text class="f" x="20" y="178" font-size="14" fill="#A9BBD8">· Assisted budgeting</text></g></g><path class="flow" d="M890 151 H940" stroke="#2DE1C2" stroke-width="2" fill="none"/><path d="M936 144 L944 151 L936 158" stroke="#2DE1C2" stroke-width="2" fill="none"/><g class="in" style="animation-delay:0.6000000000000001s"><g transform="translate(948,56)"><rect width="250" height="190" rx="14" fill="#0E1D3A" stroke="#FFFFFF" stroke-opacity="0.1"/><rect x="20" y="0" width="56" height="3" rx="1.5" fill="url(#ac)"/><text class="f" x="20" y="36" font-size="12" font-weight="700" fill="#2DE1C2" letter-spacing="2">04</text><text class="f" x="20" y="62" font-size="20" font-weight="700" fill="#FFFFFF">People</text><text class="f" x="20" y="100" font-size="14" fill="#A9BBD8">· Validate critical points</text><text class="f" x="20" y="126" font-size="14" fill="#A9BBD8">· Approve before commit</text><text class="f" x="20" y="152" font-size="14" fill="#A9BBD8">· Own the decision</text><text class="f" x="20" y="178" font-size="14" fill="#A9BBD8">· Get time back</text></g></g>
<text class="f" x="0" y="272" font-size="13" fill="#6F86AD">Controlled access in. Human validation out.</text>
